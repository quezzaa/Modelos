<body>
    <mat-card>
        <h1>Lectura de Archivos</h1>
        <p>Carga tu archivo (CSV, XLSX o XLS)</p>
        
        <div class="button-container">
            <button mat-raised-button color="primary" (click)="fileInput.click()">
                <mat-icon>upload_file</mat-icon>
                Seleccionar archivo
            </button>
            <input #fileInput type="file" hidden (change)="Lector($event)" accept=".csv,.xlsx,.xls" />
            <span *ngIf="fileName()" class="file-name">{{ fileName() }}</span>
        </div>
        
        <div *ngIf="tableData().length > 0" class="content-container">
            <h2>Datos del Archivo:</h2>
            <table mat-table [dataSource]="tableData()" class="mat-elevation-z8">
                <!-- Columna N -->
                <ng-container matColumnDef="N">
                    <th mat-header-cell *matHeaderCellDef>N (Largo de la fila)</th>
                    <td mat-cell *matCellDef="let element">{{ element.N }}</td>
                </ng-container>

                <!-- Columna K -->
                <ng-container matColumnDef="K">
                    <th mat-header-cell *matHeaderCellDef>K (Estado)</th>
                    <td mat-cell *matCellDef="let element">{{ element.K }}</td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </div>
    </mat-card>    
</body>
